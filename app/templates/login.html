{% extends "base.html" %}

{% block title %}Log In · HackForge{% endblock %}

{% block content %}
<div class="auth-container card">
  <div class="eyebrow">Authentication</div>
  <h1 style="font-size: 28px; margin: 8px 0 20px;">Welcome Back</h1>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Log In</button>
  </form>

  <p style="margin-top: 24px; font-size: 13px; color: var(--text-muted); text-align: center;">
    Need an account? <a href="/register" style="color: var(--accent);">Create one here</a>
  </p>
</div>
{% endblock %}
