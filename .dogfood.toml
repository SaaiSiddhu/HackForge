# DOGFOOD 2026 Configuration for HackForge (Phase 1 Foundation)
#
# IMPORTANT: Phase 1 establishes the tested foundation (FastAPI, PostgreSQL,
# migrations, fixture import, public gallery, search, project details).
# Authentication, submissions, and judging are Phase 2-4 milestones.
# Per specification, no tiers are claimed until workflows are fully implemented.

[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = []
pitch = "HackForge: Build. Submit. Judge. Self-hosted hackathon submission and judging platform."

[auth]
# Phase 1 does not implement authentication. Placeholders for Phase 2:
# organizer   = "Cookie: session=org_demo"
# judge_a     = "Cookie: session=jdg_a_demo"
# judge_b     = "Cookie: session=jdg_b_demo"
# participant = "Cookie: session=prt_demo"

[routes]
gallery = "/projects"
