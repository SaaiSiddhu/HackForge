# DOGFOOD 2026 Configuration for HackForge (Phase 2 T1 Workflows)

[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2"]
pitch = "HackForge: Build. Submit. Judge. Self-hosted hackathon submission and judging platform."

[auth]
organizer   = "Authorization: Bearer org_demo"
judge_a     = "Authorization: Bearer jdg_a_demo"
judge_b     = "Authorization: Bearer jdg_b_demo"
participant = "Authorization: Bearer prt_demo"

[routes]
gallery = "/projects"
submit  = "/events/evt_01/submit"
judge_scores = "/events/evt_01/judges/jdg_01/scores"
peer_scores  = "/events/evt_01/judges/jdg_01/scores"
csv_export = "/events/evt_01/export/judging.csv"
