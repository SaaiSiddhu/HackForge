services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hackforge
      POSTGRES_USER: hackforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackforge-local-demo}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackforge -d hackforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://hackforge:${POSTGRES_PASSWORD:-hackforge-local-demo}@db:5432/hackforge
      TEST_DATABASE_URL: postgresql+psycopg://hackforge:${POSTGRES_PASSWORD:-hackforge-local-demo}@db:5432/hackforge_test
      LOG_LEVEL: INFO
      FIXTURE_PATH: fixtures.json
      SEED_FIXTURES: "true"
      COOKIE_SECURE: "false"
      UPLOAD_DIR: uploads
      ENABLE_DEMO_PROVISIONING: "true"
      PYTHONPATH: /portal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - uploads:/portal/uploads

volumes:
  database:
  uploads:
